# Minimal detekt set for FreeAI4U: only the rules that catch real bugs in
# this codebase, with nothing that would flag style or metric noise on the
# existing ~3k lines. buildUponDefaultConfig is off in build.gradle.kts, so
# every rule listed here is the whole active set.
style:
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
exceptions:
  RethrowCaughtException:
    active: true