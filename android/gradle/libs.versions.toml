fragment = "1.9.0"
serialization = "1.7.3"
lifecycle = "2.11.0"
navigation3 = "1.1.7"
coroutines = "1.11.0"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
