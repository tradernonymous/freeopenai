[versions]
agp = "9.4.0"
kotlin = "2.3.21"
activity = "1.13.0"
browser = "1.10.0"
core = "1.19.0"
composeBom = "2026.09.00"
orgJson = "20240303"
junit = "4.13.2"
googleServices = "4.4.2"
