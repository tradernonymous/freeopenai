<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="FreeAi4U. Free access to OpenAI models, no key required.">
  <title>FreeAi4U</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a5a"/>
      <stop offset="1" stop-color="#2b1b5e"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a40"/>
      <stop offset="1" stop-color="#070b22"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151f4d"/>
      <stop offset="1" stop-color="#0a0f2c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>

  <ellipse cx="150" cy="330" rx="420" ry="220" fill="url(#glowCyan)">
    <animate attributeName="rx" values="420;470;420" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1080" cy="40" rx="380" ry="200" fill="url(#glowPink)">
    <animate attributeName="rx" values="380;430;380" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- isometric cards: chat, no-key, model chip -->

  <g transform="translate(700,120)" filter="url(#softGlow)">
    <polygon points="0,26 150,0 176,13 26,39" fill="url(#faceTop)" stroke="url(#neon)" stroke-width="1.4"/>
    <polygon points="0,26 26,39 26,139 0,126" fill="url(#faceLeft)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <polygon points="26,39 176,13 176,113 26,139" fill="url(#faceRight)" stroke="url(#neon)" stroke-width="1.2"/>
  </g>
  <g transform="translate(742,150)">
    <path d="M4 4 h96 a10 10 0 0 1 10 10 v36 a10 10 0 0 1 -10 10 h-70 l-16 16 v-16 h-10 a10 10 0 0 1 -10 -10 v-36 a10 10 0 0 1 10 -10 Z" fill="#ffffff" fill-opacity="0.08" stroke="url(#neon)" stroke-width="1.5"/>
    <circle cx="30" cy="34" r="5" fill="#22d3ee">
      <animate attributeName="cy" values="34;26;34" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="34" r="5" fill="#a78bfa">
      <animate attributeName="cy" values="34;26;34" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="34" r="5" fill="#f472b6">
      <animate attributeName="cy" values="34;26;34" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(890,200)" filter="url(#softGlow)">
    <polygon points="0,26 130,0 156,13 26,39" fill="url(#faceTop)" stroke="url(#neon)" stroke-width="1.4"/>
    <polygon points="0,26 26,39 26,119 0,106" fill="url(#faceLeft)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <polygon points="26,39 156,13 156,93 26,119" fill="url(#faceRight)" stroke="url(#neon)" stroke-width="1.2"/>
  </g>
  <g transform="translate(930,222)">
    <circle cx="20" cy="16" r="12" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <rect x="14" y="24" width="12" height="16" rx="3" fill="#a78bfa"/>
    <line x1="2" y1="2" x2="38" y2="38" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(1000,90)" filter="url(#softGlow)">
    <polygon points="0,26 120,0 146,13 26,39" fill="url(#faceTop)" stroke="url(#neon)" stroke-width="1.4"/>
    <polygon points="0,26 26,39 26,115 0,102" fill="url(#faceLeft)" stroke="#22d3ee" stroke-opacity="0.35"/>
    <polygon points="26,39 146,13 146,89 26,115" fill="url(#faceRight)" stroke="url(#neon)" stroke-width="1.2"/>
  </g>
  <g transform="translate(1036,106)">
    <rect x="8" y="8" width="34" height="34" rx="5" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="18" y="18" width="14" height="14" rx="2" fill="#050816"/>
    <line x1="25" y1="0" x2="25" y2="8" stroke="#22d3ee" stroke-width="3"/>
    <line x1="25" y1="42" x2="25" y2="50" stroke="#22d3ee" stroke-width="3"/>
    <line x1="0" y1="25" x2="8" y2="25" stroke="#22d3ee" stroke-width="3"/>
    <line x1="42" y1="25" x2="50" y2="25" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="42" cy="8" r="4" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="72" y="178" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#neon)" filter="url(#glow)">FreeAi4U</text>
  <text x="76" y="226" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">Chat with OpenAI models. No key, no backend, no bill in your name.</text>
  <text x="76" y="266" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="3">PUTER.JS  ·  STREAMING  ·  ZERO CONFIG  ·  NO API KEYS</text>
  <rect x="76" y="290" width="360" height="3" rx="1.5" fill="url(#neon)"/>

  <rect x="0" y="0" width="300" height="380" fill="url(#sweep)" opacity="0.6">
    <animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
