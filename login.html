<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Sign in | Free OpenAI API</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --surface-2: #1a1a1a;
            --border: #333333;
            --text: #eeeeee;
            --text-dim: #bbbbbb;
            --text-muted: #999999;
            --accent: #ffffff;
            --danger: #ff4444;
            --r: 12px;
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 28px;
        }
        h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        p.sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .field { margin-bottom: 14px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%;
            margin-top: 6px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            display: none;
            background: rgba(255,68,68,0.12);
            border: 1px solid var(--danger);
            color: #ff8080;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            margin-bottom: 14px;
        }
        .error.visible { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p class="sub">This instance is private. Enter the username and password set for it.</p>
        <div class="error" id="loginError"></div>
        <form id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="submitBtn">Sign in</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');

        const params = new URLSearchParams(location.search);
        const redirectTo = params.get('redirect') && params.get('redirect').startsWith('/') ? params.get('redirect') : '/';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                if (res.ok) {
                    location.href = redirectTo;
                    return;
                }
                const data = await res.json().catch(() => ({}));
                errorBox.textContent = data.error || 'Sign in failed.';
                errorBox.classList.add('visible');
            } catch {
                errorBox.textContent = 'Network error — please try again.';
                errorBox.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
