<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shared chat</title>
<!-- The reader reuses the page's own markdown renderer so a shared answer
     reads exactly as it was written. Nothing here can write: there is no
     composer, no fetch to any provider, and the payload arrives from the same
     origin that served this file. -->
<script src="/chatlib.js"></script>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #0d0f14;
        color: #e8eaed;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
        padding: 14px 20px;
        border-bottom: 1px solid #23262e;
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    header span { color: #8b909a; font-size: 12px; }
    main { max-width: 780px; margin: 0 auto; padding: 24px 20px 80px; }
    .msg { margin-bottom: 22px; }
    .who { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b909a; margin-bottom: 6px; }
    .msg.user .who { color: #6ea8fe; }
    .bubble { padding: 12px 16px; border-radius: 14px; overflow-wrap: anywhere; }
    .msg.user .bubble { background: #1a2333; }
    .msg.bot .bubble { background: #15171d; border: 1px solid #23262e; }
    .bubble img { max-width: 100%; border-radius: 10px; display: block; margin: 8px 0; }
    .bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble pre { background: #0d0f14; border: 1px solid #23262e; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    footer { text-align: center; color: #8b909a; font-size: 12px; padding: 24px; }
    footer a { color: #6ea8fe; text-decoration: none; }
    .expired { text-align: center; padding: 80px 20px; color: #8b909a; }
</style>
</head>
<body>
<header>
    <h1 id="shareTitle">Shared chat</h1>
    <span id="shareMeta"></span>
    <a id="shareForkLink" href="#" style="margin-left: auto; display: none; color: #6ea8fe; text-decoration: none; font-size: 12px; white-space: nowrap;">Fork this chat →</a>
</header>
<main id="shareMain" aria-live="polite"><div class="expired">Loading…</div></main>
<footer><a href="/">Open NeuraOS</a></footer>
<script>
(function () {
    var id = location.pathname.split('/').pop();
    var main = document.getElementById('shareMain');
    fetch('/api/share/' + encodeURIComponent(id), { credentials: 'omit' })
        .then(function (res) { if (!res.ok) throw new Error('gone'); return res.json(); })
        .then(function (data) {
            document.getElementById('shareTitle').textContent = data.title || 'Shared chat';
            document.title = (data.title || 'Shared chat') + ' — shared chat';
            var n = (data.messages || []).length;
            document.getElementById('shareMeta').textContent = n + (n === 1 ? ' message' : ' messages') + ' · read-only';
            // Forking is a client-side concept -- chats live in the reader's own
            // browser, not on this server -- so the link just hands the app's
            // own page the same id it already fetched, via the fragment
            // convention app.js's parseAppLink already reads (#new, #share=).
            var fork = document.getElementById('shareForkLink');
            fork.href = '/#fork=' + encodeURIComponent(id);
            fork.style.display = 'inline';
            main.innerHTML = '';
            for (var i = 0; i < n; i++) {
                var m = data.messages[i];
                var wrap = document.createElement('div');
                wrap.className = 'msg ' + (m.type === 'user' ? 'user' : 'bot');
                var who = document.createElement('div');
                who.className = 'who';
                who.textContent = m.type === 'user' ? 'You' : 'Assistant';
                wrap.appendChild(who);
                var bubble = document.createElement('div');
                bubble.className = 'bubble';
                // textContent first, then the page's own renderer: nothing in a
                // shared payload runs as anything but text or rendered markdown.
                if (m.content) {
                    var body = document.createElement('div');
                    body.innerHTML = renderMarkdownLite(String(m.content));
                    bubble.appendChild(body);
                }
                (m.images || []).forEach(function (src) {
                    if (typeof src !== 'string' || !src.startsWith('data:image/')) return;
                    var img = document.createElement('img');
                    img.src = src;
                    img.alt = 'Shared image';
                    img.loading = 'lazy';
                    bubble.appendChild(img);
                });
                wrap.appendChild(bubble);
                main.appendChild(wrap);
            }
        })
        .catch(function () {
            main.innerHTML = '<div class="expired"><p>This shared chat has expired or was revoked.</p><p><a href="/">Open the app</a></p></div>';
        });
})();
</script>
</body>
</html>
