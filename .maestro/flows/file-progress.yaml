appId: com.neura.os
# Needs a real model provider (image generation, a remote build, an
# approval): skipped against CI's throwaway engine, run against a real one.
tags:
  - needs-provider
---
# Build mode: stage a file write and open the review sheet.
# There is no standalone file-browser screen in this app -- Build mode's file
# tools stage into Conversation.pendingWrites and surface as a banner over the
# composer (ui/WorkspaceScreens.kt: PendingWritesBanner, WorkspaceReviewSheet).
- launchApp
- tapOn:
    text: "Build"
    optional: true
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "create a file named notes.txt with the text hello"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: ".*waiting for your approval"
    timeout: 60000
- tapOn:
    text: "Review"
    optional: true
- assertVisible:
    text: "Review changes"
    optional: true
- assertVisible:
    text: "notes.txt"
    optional: true

---
# Build mode: approve a staged write, applying it to the conversation's files.
- launchApp
- tapOn:
    text: "Build"
    optional: true
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "create a file named applied.txt with the text hello"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: ".*waiting for your approval"
    timeout: 60000
- tapOn:
    text: "Review"
    optional: true
- tapOn:
    text: ".*Apply.*"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Review changes"
    timeout: 10000

---
# Build mode: reject a staged write, leaving the conversation's files untouched.
- launchApp
- tapOn:
    text: "Build"
    optional: true
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "create a file named rejected.txt with the text hello"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: ".*waiting for your approval"
    timeout: 60000
- tapOn:
    text: "Review"
    optional: true
- tapOn:
    text: "Reject all"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Review changes"
    timeout: 10000