appId: com.neura.os
---
# Chat progress: typing indicator and streaming response
- launchApp
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "Write a short poem about testing"
- tapOn:
    text: "Send"
    optional: true
- tapOn:
    id: "send_button"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Stop"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "chat_input"
    timeout: 5000

---
# Chat progress: stop streaming
- launchApp
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "Write a very long story about a dragon that never ends"
- tapOn:
    text: "Send"
    optional: true
- tapOn:
    id: "send_button"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Stop"
    timeout: 10000
- tapOn:
    text: "Stop"
- extendedWaitUntil:
    notVisible:
      text: "Stop"
    timeout: 10000

---
# Chat progress: voice mode toggle
- launchApp
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- tapOn:
    text: "Voice mode"
    optional: true
- assertVisible:
    text: "Listening"
    optional: true
- tapOn:
    text: "End voice"
    optional: true
- assertVisible:
    id: "chat_input"
    timeout: 5000