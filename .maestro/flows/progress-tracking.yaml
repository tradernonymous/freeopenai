appId: com.neura.os
---
# Progress tracking: AI response streaming
- launchApp
- assertVisible: "Ask anything..."
- tapOn: "Ask anything..."
- inputText: "Hello, this is a test message for progress tracking"
- tapOn:
    id: "sendButton"
- assertVisible:
    text: "READY"
    timeout: 5000
- assertVisible:
    text: "SENDING"
    optional: true
- assertVisible:
    text: "RECEIVING"
    optional: true
- assertVisible:
    text: "READY"
    timeout: 30000

---
# Progress tracking: Image generation
- launchApp
- assertVisible: "Ask anything..."
- tapOn: "Ask anything..."
- inputText: "generate a 16:9 image of a sunset"
- tapOn:
    id: "sendButton"
- assertVisible:
    text: "DRAW"
    timeout: 10000
- assertVisible:
    text: "Image generation"
    optional: true
- assertVisible:
    text: "READY"
    timeout: 60000

---
# Progress tracking: Build mode tool execution
- launchApp
- tapOn:
    text: "Build"
    optional: true
- assertVisible: "Ask anything..."
- tapOn: "Ask anything..."
- inputText: "create a hello world python script"
- tapOn:
    id: "sendButton"
- assertVisible:
    text: "RUNNING"
    timeout: 10000
- assertVisible:
    text: "READY"
    timeout: 60000

---
# Progress tracking: File operations
- launchApp
- tapOn:
    text: "Settings"
    optional: true
- tapOn:
    text: "Workspace"
    optional: true
- assertVisible: "Files"
- tapOn:
    text: "Create file"
    optional: true
- inputText: "test.txt"
- tapOn:
    text: "Create"
    optional: true
- assertVisible: "test.txt"
- assertVisible:
    text: "READY"
    timeout: 10000