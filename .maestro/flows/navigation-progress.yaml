appId: com.neura.os
---
# Navigation: mode switching progress
- launchApp
- assertVisible:
    text: "Chat"
- tapOn:
    text: "Plan"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Plan"
    timeout: 5000
- assertVisible:
    id: "chat_input"
- tapOn:
    text: "Build"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Build"
    timeout: 5000
- assertVisible:
    id: "chat_input"
- tapOn:
    text: "Chat"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Chat"
    timeout: 5000

---
# Navigation: session panel progress
- launchApp
- assertVisible:
    text: "Chat"
- tapOn:
    id: "session_button"
    optional: true
- assertVisible:
    text: "Session"
    optional: true
- assertVisible:
    text: "Mode"
    optional: true
- assertVisible:
    text: "Skills"
    optional: true
- back
- extendedWaitUntil:
    notVisible:
      text: "Session"
    timeout: 5000

---
# Navigation: history drawer
- launchApp
- assertVisible:
    text: "Chat"
- tapOn:
    id: "drawer_button"
    optional: true
- assertVisible:
    text: "Search"
    optional: true
- tapOn:
    text: "New chat"
    optional: true
- assertVisible:
    id: "chat_input"
    timeout: 5000