appId: com.neura.os
---
# Image generation progress
- launchApp
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "generate a 16:9 image of a mountain landscape at sunset"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: "Stop"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      text: "Stop"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "chat_input"
    timeout: 5000

---
# Image generation: stop during generation
- launchApp
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "generate a detailed 4k image of a futuristic city"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: "Stop"
    timeout: 15000
- tapOn:
    text: "Stop"
- extendedWaitUntil:
    notVisible:
      text: "Stop"
    timeout: 10000