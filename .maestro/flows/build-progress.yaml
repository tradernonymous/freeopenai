appId: com.neura.os
# Needs a real model provider (image generation, a remote build, an
# approval): skipped against CI's throwaway engine, run against a real one.
tags:
  - needs-provider
---
# Build mode: tool execution progress
- launchApp
- assertVisible:
    text: "Chat"
    optional: true
- tapOn:
    text: "Build"
    optional: true
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "create a python hello world file"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: "RUNNING"
    timeout: 15000
- assertVisible:
    text: ".*1 steps"
    optional: true
- assertVisible:
    text: ".*2 steps"
    optional: true
- extendedWaitUntil:
    visible:
      text: "DONE"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "chat_input"
    timeout: 5000

---
# Build mode: task progress (LinearProgressIndicator)
- launchApp
- tapOn:
    text: "Build"
    optional: true
- assertVisible:
    id: "chat_input"
- tapOn:
    id: "chat_input"
- inputText: "create a multi-file project with main.py and utils.py"
- tapOn:
    id: "send_button"
- extendedWaitUntil:
    visible:
      text: "RUNNING"
    timeout: 15000
- assertVisible:
    text: ".*steps"
    optional: true
- extendedWaitUntil:
    visible:
      text: "DONE"
    timeout: 120000
- assertVisible:
    id: "chat_input"
    timeout: 5000