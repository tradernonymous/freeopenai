appId: com.neura.os
---
# Run once before flows/: a fresh install opens on the sign-in screen, so
# every flow that looked for chat_input failed on it. CI starts an engine on
# the runner (10.0.2.2 from the emulator) with this throwaway account.
- launchApp
# # The sign-in screen must be up before the `when:` below is evaluated:
# that check polls for ~6s on a fresh runner, and an emulator still doing
# first-launch work skips the whole sign-in block in that window -- no
# credentials were ever typed, and the final chat_input wait failed against
# the login screen (run 37405186453). Wait for the screen itself first.
- extendedWaitUntil:
    visible:
      id: "login_submit"
    timeout: 45000
# The CI emulator sometimes raises "System UI isn't responding" over the app.
- runFlow:
    when:
      visible:
        text: ".*isn't responding"
    commands:
      - tapOn:
          text: "Wait"
- runFlow:
    when:
      visible:
        id: "login_submit"
    commands:
      - tapOn:
          id: "login_server"
      - eraseText: 80
      - inputText: "http://10.0.2.2:3000"
      - tapOn:
          id: "login_username"
      - eraseText: 40
      - inputText: "maestro"
      # The password field sits under the once-open keyboard: the sign-in
      # column scrolls under the IME (imePadding as well), so Compose stops
      # exposing login_password in the hierarchy it reports until the
      # keyboard is gone -- CI (37401119070) failed here with "Element not
      # found: login_password". Close it before reaching that far down.
      - hideKeyboard
      - tapOn:
          id: "login_password"
      - inputText: "maestro-ci-only"
      - hideKeyboard
      - tapOn:
          id: "login_submit"
- extendedWaitUntil:
    visible:
      id: "chat_input"
    timeout: 30000
