name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test

  # The smoke drives the real page in headless Chrome, from the login form to the
  # composer, so it is the only check that can see the wiring between a rule and
  # the DOM it is meant to change -- the class of bug the unit tests, which never
  # render, passed for months. That is worth a run on every push rather than when
  # someone remembers to type it.
  #
  # Its own job, and its own Node: the client speaks CDP over the built-in
  # WebSocket, so it needs Node 22+, where the unit tests need neither a browser
  # nor a modern runtime. It starts its own server on a free port, so it shares
  # nothing with the job above.
  smoke:
    runs-on: ubuntu-latest
    # Generous, and still a bound: the phases wait on the page, and a wedged
    # browser should fail in minutes rather than hold the runner for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # The runner image ships Chrome on the paths the smoke already looks in; if
      # a future image moves it, this fails naming SMOKE_CHROME rather than
      # silently not checking anything.
      - run: npm run smoke
        # The smoke's own server reads the skill catalogue from GitHub's API, and
        # an unauthenticated runner gets 60 requests an hour shared with every
        # other build on that address -- so the phase that pins a skill would
        # skip on every run. The workflow's token lifts that. It reaches nothing
        # else: GITHUB_TOKEN appears in one place in the app, that catalogue.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Maestro UI tests for Android - runs against a debug build in an emulator.
  # Phase 4: Progress tracking UI tests.
  #
  # Two jobs, mirroring android.yml's build -> smoke split: the emulator-boot
  # job runs on a completely clean runner with nothing else touching the
  # Android SDK first. A combined single-job version (SDK setup + gradle build
  # + emulator-runner all in one runner) hit "Unable to connect to adb daemon
  # on port: 5037" -- the sdkmanager-driven platform-tools install for the
  # gradle build left an adb server state that fought with the one
  # reactivecircus/android-emulator-runner manages. Splitting into two jobs,
  # like android.yml's build/smoke jobs already do, avoids that entirely.
  #
  # Runs on ubuntu-latest via reactivecircus/android-emulator-runner instead of
  # a hand-rolled boot loop on macos-latest: macOS runners have no nested
  # hypervisor at all, so the emulator only ever boots in software mode there
  # (TCG), and the "appear in adb devices" step's 3-minute budget was too
  # tight for that cold boot on a shared runner -- it failed to even reach
  # that point on roughly 20 consecutive CI runs despite several rounds of
  # targeted fixes. android.yml's own `smoke` job already proves this same
  # action + api-29 x86_64 image boots reliably on ubuntu-latest, so this
  # reuses that proven combination instead of continuing to re-tune the macOS
  # one.
  maestro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  maestro:
    needs: maestro-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking: the emulator-boot infra is now proven reliable (see the
    # comment above maestro-build), but the flow content itself -- text
    # labels and element ids the flows assume exist -- has never been
    # verified end to end against the real Compose UI (this suite went red
    # on infra before ever reaching that content). Two real content bugs
    # (an invalid `timeout` property, ids the UI didn't expose) are already
    # fixed here; continue-on-error keeps any further ones from blocking
    # `main` while still surfacing the failure and its report artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maestro-debug-apk
          path: android/app/build/outputs/apk/debug/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The app cannot reach chat without signing in, so the flows need an
      # engine: this one lives only for the job, with a throwaway account.
      - name: Start a throwaway engine for the emulator
        run: |
          AUTH_USER_1=maestro AUTH_PASS_1=maestro-ci-only PORT=3000 nohup node server.js > engine.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      # Same alignment android.yml's smoke job needs: the runner pre-sets
      # ANDROID_AVD_HOME to a nonstandard path, but the pinned emulator-runner
      # insists the AVD lives at ~/.android/avd.
      - name: Align the AVD home for the emulator action
        run: |
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - name: Boot the emulator and run Maestro flows
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@1b48cf25bcdcd1c835908e340039354ff983978a
        with:
          api-level: 29
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -memory 1536
          # Single flat command, same reason as android.yml's smoke.sh: the
          # action splices script: into its own shell and mangles embedded
          # if/fi and $(...), so the real logic lives in a checked-in file.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/maestro-smoke.sh"
      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: .maestro/build/reports/