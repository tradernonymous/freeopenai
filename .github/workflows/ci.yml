name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test

  # The smoke drives the real page in headless Chrome, from the login form to the
  # composer, so it is the only check that can see the wiring between a rule and
  # the DOM it is meant to change -- the class of bug the unit tests, which never
  # render, passed for months. That is worth a run on every push rather than when
  # someone remembers to type it.
  #
  # Its own job, and its own Node: the client speaks CDP over the built-in
  # WebSocket, so it needs Node 22+, where the unit tests need neither a browser
  # nor a modern runtime. It starts its own server on a free port, so it shares
  # nothing with the job above.
  smoke:
    runs-on: ubuntu-latest
    # Generous, and still a bound: the phases wait on the page, and a wedged
    # browser should fail in minutes rather than hold the runner for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # The runner image ships Chrome on the paths the smoke already looks in; if
      # a future image moves it, this fails naming SMOKE_CHROME rather than
      # silently not checking anything.
      - run: npm run smoke
        # The smoke's own server reads the skill catalogue from GitHub's API, and
        # an unauthenticated runner gets 60 requests an hour shared with every
        # other build on that address -- so the phase that pins a skill would
        # skip on every run. The workflow's token lifts that. It reaches nothing
        # else: GITHUB_TOKEN appears in one place in the app, that catalogue.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Maestro UI tests for Android - runs on macOS for emulator support
  # Phase 4: Progress tracking UI tests
  maestro:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # arm64, not x86_64: macos-latest runners are Apple Silicon, and the
          # translated x86_64 image never finished booting -- two runs in a row
          # sat in the boot wait until the 40-minute job timeout.
          packages: platform-tools platforms;android-35 system-images;android-35;google_apis;arm64-v8a
          emulator: true
      - name: Create and start emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-35;google_apis;arm64-v8a" --force
          # -accel off: the macOS runners expose no nested hypervisor (the
          # emulator dies with "failed to initialize HVF"), so TCG emulates
          # the ARM guest. Slow to boot, but it boots; the waits below bound
          # a wedge to minutes instead of the job timeout. No bare
          # `adb wait-for-device` anywhere: it waits forever.
          # (`-no-accel` looks equivalent but the emulator still probes HVF;
          # only `-accel off` disables it.)
          $ANDROID_HOME/emulator/emulator -avd test -accel off -no-snapshot-load -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          started=""
          for i in $(seq 1 18); do
            if adb devices | grep -q emulator; then started="yes"; break; fi
            sleep 10
          done
          if [ -z "$started" ]; then echo "emulator did not appear in adb devices"; adb devices; exit 1; fi
          booted=""
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted="yes"; break; fi
            sleep 10
          done
          if [ -z "$booted" ]; then echo "emulator never finished booting"; exit 1; fi
          echo "emulator booted"
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Install APK
        run: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
      - name: Run Maestro tests
        run: |
          cd .maestro
          maestro test flows/
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: .maestro/build/reports/