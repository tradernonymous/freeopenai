name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    # At job level because a step's `if` cannot read `secrets` -- only `env`,
    # `steps` and the like. Empty when the repository has no certificate, which
    # is the ordinary case and must produce exactly the build it produced before.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      # The desktop's own gate, so a shell or frontend mistake fails here as
      # well as in CI: config + engine wiring, the update-check rules, the
      # chat store, and the connection copy. Paths are repo-root relative (this
      # job has no working-directory), and that is where these files live.
      # test/desktop.test.js reads the whole shell as one source, so moving a
      # concern between Rust modules does not break it.
      - name: Desktop tests (config + engine wiring)
        run: >-
          node --test
          test/desktop.test.js
          test/desktop-update.test.js
          test/desktop-chats.test.js
          test/desktop-connection.test.js
          test/desktop-onboarding.test.js
          test/desktop-umd.test.js
          test/desktop-net.test.js
          test/desktop-diagnostics.test.js
          test/desktop-shell.test.js
          test/desktop-commands.test.js
          test/desktop-toasts.test.js
          test/desktop-local.test.js
          test/desktop-failure.test.js
          test/desktop-images.test.js
          test/desktop-models.test.js
          test/desktop-zen-glass.test.js
          test/desktop-contract.test.js
          test/desktop-fallback.test.js
          test/desktop-radial.test.js
          test/desktop-plan.test.js
          test/desktop-hf.test.js
          test/desktop-coding-agent.test.js
          test/desktop-handoff.test.js
          test/desktop-cors.test.js
          test/desktop-p6p8p9.test.js
      # Code signing is a certificate, not code, so the pipeline is built to
      # switch on the moment the repository has one and to be exactly today's
      # build when it does not. `bundle.windows.certificateThumbprint` is
      # already declared in tauri.conf.json; this imports the .pfx into the
      # runner's own store and passes the thumbprint as a build-time config
      # override, so nothing in the repo has to change to sign.
      - name: Import the signing certificate (only when one is configured)
        id: signing
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Imported signing certificate $($imported.Thumbprint) ($($imported.Subject))"

      - name: Build Tauri app
        working-directory: desktop
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.thumbprint }}') {
            npm run tauri:build -- --config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"${{ steps.signing.outputs.thumbprint }}\"}}}"
          } else {
            Write-Host '::warning::Building UNSIGNED - set WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD to sign.'
            npm run tauri:build
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The update-signing PUBLIC key (roadmap 5.9), compiled into net.rs.
          # Empty (the variable unset) keeps the sha256-only update check.
          NEURAOS_UPDATER_PUBKEY: ${{ vars.NEURAOS_UPDATER_PUBKEY }}

      # A build that says it is signed must be signed. Verifying here is the
      # difference between "we passed the thumbprint" and "the file Windows
      # will trust".
      - name: Verify the signature (only when signing)
        if: ${{ steps.signing.outputs.thumbprint != '' }}
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          $files += Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi
          $files += Get-Item desktop/src-tauri/target/release/freeai4u-desktop.exe
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad artifact(s) are not validly signed although a certificate was configured" }
      - name: Upload Installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraOS-Desktop-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeuraOS-Desktop-Portable
          path: desktop/src-tauri/target/release/freeai4u-desktop.exe
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: NeuraOS-Desktop-MSI
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
      # The app's update check reads this file instead of guessing a version out
      # of asset names: it carries the real version and a sha256 + size for every
      # artifact, taken from the files this job just built.
      - name: Write update metadata (version + sha256 + size)
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $paths = @()
          $paths += Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          $paths += Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi
          $paths += Get-Item desktop/src-tauri/target/release/freeai4u-desktop.exe
          $artifacts = @()
          foreach ($p in $paths) {
            $artifacts += [ordered]@{
              name   = $p.Name
              sha256 = (Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLower()
              size   = $p.Length
            }
          }
          $meta = [ordered]@{
            version   = $version
            builtAt   = (Get-Date).ToUniversalTime().ToString('o')
            commit    = '${{ github.sha }}'
            artifacts = $artifacts
          }
          $json = $meta | ConvertTo-Json -Depth 6
          Set-Content -Path desktop/src-tauri/target/release/desktop-version.json -Value $json -Encoding utf8
          Get-Content desktop/src-tauri/target/release/desktop-version.json
      # The manifest's signature (5.9). A build that compiled a public key in
      # MUST ship a signature, or every installed copy would refuse the update,
      # so a key without its private half fails the job instead.
      - name: Sign update metadata
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEURAOS_UPDATER_PUBKEY: ${{ vars.NEURAOS_UPDATER_PUBKEY }}
        run: |
          $manifest = 'src-tauri/target/release/desktop-version.json'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            if ($env:NEURAOS_UPDATER_PUBKEY) { throw 'NEURAOS_UPDATER_PUBKEY is set but TAURI_SIGNING_PRIVATE_KEY is not: this build would refuse its own updates.' }
            Write-Host '::warning::Update metadata is UNSIGNED - see docs/desktop.md (Update signing).'
            exit 0
          }
          npx tauri signer sign $manifest
          if (-not (Test-Path "$manifest.sig")) { throw 'tauri signer produced no .sig' }
          Get-Content "$manifest.sig"
      - name: Delete old release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete desktop-latest --yes --repo ${{ github.repository }} || true
          git tag -d desktop-latest || true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: NeuraOS Desktop for Windows (latest build)
          body: |
            ${{ steps.signing.outputs.thumbprint != '' && 'Signed build — the installer and the portable exe carry an Authenticode signature this job verified.' || 'Unsigned build — Windows SmartScreen will warn on first run. See docs/desktop.md (Signing) for the certificate the pipeline is waiting for.' }}

            Built from `${{ github.sha }}`. Update metadata (`desktop-version.json`: version, sha256 and size per artifact) is published with this release and read by the app''s own update check.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/freeai4u-desktop.exe
            desktop/src-tauri/target/release/desktop-version.json
            desktop/src-tauri/target/release/desktop-version.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}