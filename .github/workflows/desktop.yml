name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FreeAI4U-Desktop
          path: desktop/src-tauri/target/release/nsis/*.exe
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: FreeAI4U-Desktop-MSI
          path: desktop/src-tauri/target/release/msi/*.msi
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: desktop-latest
          name: FreeAI4U Desktop for Windows (latest build)
          files: |
            desktop/src-tauri/target/release/nsis/*.exe
            desktop/src-tauri/target/release/nsis/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
