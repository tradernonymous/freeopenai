name: Android

# The testing APK builds here because no developer machine in this project
# carries the Android SDK: the runner installs the toolchain, runs the JVM
# unit tests, and uploads the debug APK as an installable artifact.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:testDebugUnitTest
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: freeai4u-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 21
