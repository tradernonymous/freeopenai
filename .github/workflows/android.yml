name: Android

# The APK builds here because no developer machine in this project carries
# the Android SDK: the runner installs the toolchain, runs the JVM unit
# tests, builds the signed release APK and publishes it to the rolling
# `apk-latest` GitHub release, where a phone can download it straight from
# the browser. Without a signing key in the repository's secrets it falls
# back to the debug variant as an artifact, so a fork still builds.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Repository *variables* (not secrets): baked into the APK as the
      # first launch's defaults. The password is never a build input.
      APK_SERVER_URL: ${{ vars.APK_SERVER_URL }}
      APK_USERNAME: ${{ vars.APK_USERNAME }}
      APK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/apk-latest/version.json
      APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
      HAS_KEYSTORE: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Firebase push is entirely optional (see app/build.gradle.kts): unset
      # this secret and the build just never gets a google-services.json,
      # same as a developer's own machine with no Firebase project set up.
      - name: Restore the Firebase config, if one is set
        if: env.HAS_FIREBASE == 'true'
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
      - name: Patch Firebase package name for NeuraOS
        if: env.HAS_FIREBASE == 'true'
        run: |
          # The secret's google-services.json may still reference the old
          # package name. Add the new one so processDebugGoogleServices passes.
          sed -i 's/com\.freeai4u\.app/com.neura.os/g' app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The action is kept for PATH + ANDROID_HOME, but its default package
      # list names the `tools` package, which no longer exists -- that failed
      # the whole job before Gradle ever ran. Only platform-tools comes from
      # the action; the API-35 pieces install below. (Pinned to a full SHA:
      # it is third party and this job signs the APK.)
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # Pinned to a full SHA (third-party action in a job that holds the
      # keystore secrets).
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: 8.10.2
      # Every build's versionCode goes up, so each installs over the last.
      - run: echo "APK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: gradle :app:testDebugUnitTest
      - name: Restore the signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          printf '%s' "${{ secrets.APK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "APK_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build the signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/neuraos.apk"
      - name: Build the debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/neuraos.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neuraos-apk
          path: ${{ runner.temp }}/neuraos.apk
          retention-days: 30
      - name: Publish to the rolling apk-latest release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="NeuraOS Android app, build $APK_VERSION_CODE (from $GITHUB_SHA). Every push to main that touches android/ replaces neuraos.apk here; install it over the previous build, it keeps its data."
          if gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit apk-latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" --title "NeuraOS Android app (latest build)" --notes "$NOTES"
          fi
          # What the installed app reads to offer the next build (see
          # MainActivity.checkForUpdate). The link is the stable asset URL.
          printf '{"versionCode":%s,"versionName":"2.0.%s","url":"https://github.com/%s/releases/download/apk-latest/neuraos.apk","notes":"Build %s from %s"}\n' \
            "$APK_VERSION_CODE" "$APK_VERSION_CODE" "$GITHUB_REPOSITORY" "$APK_VERSION_CODE" "${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/version.json"
          # APK first, manifest second: a phone never sees a version that is
          # not downloadable yet.
          gh release upload apk-latest "$RUNNER_TEMP/neuraos.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload apk-latest "$RUNNER_TEMP/version.json" --repo "$GITHUB_REPOSITORY" --clobber
