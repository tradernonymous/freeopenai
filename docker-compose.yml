# Compose project name is pinned so this repo ADOPTS the stack that was first
# started from a now-deleted folder, instead of shadowing it. Without it the
# project would be named after this directory, and `docker compose up` would
# create an empty second `freeopenai_omniroute-data` volume and collide on port
# 20128 -- which looks exactly like OmniRoute having been reset.
name: app

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    ports: ["20128:20128"]
    env_file: .env
    volumes: ["omniroute-data:/app/data"]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Quick tunnel: public trycloudflare.com URL, no token needed, works without a domain.
    # NOTE: URL changes if this container is recreated (docker compose up --force-recreate / machine reboot).
    # Get the URL from: docker logs app-cloudflared-1  (look for https://xxx.trycloudflare.com)
    command: tunnel --no-autoupdate --url http://omniroute:20128
    depends_on: [omniroute]
    restart: unless-stopped

volumes:
  omniroute-data:
