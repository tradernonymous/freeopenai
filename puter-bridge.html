<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NeuraOS Puter bridge</title>
    <!--
      Loaded invisibly by the Android app (PuterBridge.kt) so it can draw and
      chat on the user's own Puter account. fa4uSignIn(id) is the one job that
      is ever seen: it shows a Continue prompt (the app makes this WebView
      full-screen for it), and that tap opens puter.auth.signIn()'s popup,
      which Android's WebChromeClient hosts in a visible dialog. It only runs
      when the app asks for it directly, never as a side effect of a
      background job.
      fa4uDraw(id, prompt, options) and fa4uChat(id, payload) fail fast instead
      if nobody has signed in yet. Every job is read the same way: poll
      fa4uStatus(id), then fa4uChunk for the picture. options is optional:
      { model, ratio: {w,h}, source }.
    -->
    <!--
      Everything below runs before Puter's SDK, and nothing in it can throw:
      three real-device reports have now come back as "the button animates and
      no window appears", which is the same observable symptom for at least
      four different causes -- the SDK script never arriving, the SDK arriving
      but failing its own setup, window.open() never being called, and
      window.open() being called and refused by the WebView. Guessing between
      those from a phone screenshot has cost three round trips. This records
      which one it is, so the next attempt answers it outright.
    -->
    <script>
        // 'pending' until the SDK's own script tag settles, then 'loaded' or
        // 'failed'. A 'loaded' that still leaves `puter` undefined is a real
        // and separate case (the file arrived and threw), which is why this
        // is tracked apart from typeof puter rather than inferred from it.
        window.fa4uScript = 'pending';

        // Wrapped before the SDK loads, so the SDK captures this rather than
        // the original. Sign-in is one window.open() plus a postMessage back
        // through window.opener, and "did anything even try to open a window"
        // is the single fact that tells a WebView problem apart from an SDK
        // one. Nothing is blocked: the real window.open still runs and its
        // return value is passed straight back.
        window.fa4uOpened = 0;
        window.fa4uOpenBlocked = 0;
        (function () {
            var real = window.open;
            window.open = function () {
                window.fa4uOpened++;
                var opened = null;
                try {
                    opened = real.apply(window, arguments);
                } catch (e) {
                    window.fa4uOpenError = String((e && e.message) || e).slice(0, 200);
                }
                if (!opened) window.fa4uOpenBlocked++;
                return opened;
            };
        })();

        // Deliberately defined here rather than in the body block below: if
        // that block ever dies partway (the failure mode the try/catch around
        // onAuthStateChanged exists for), every fa4u function goes with it and
        // the app is left with no way to ask what happened. This one survives
        // that, because nothing above it can throw.
        window.fa4uDiagnose = function () {
            var out = {
                script: window.fa4uScript || 'unknown',
                puter: typeof puter,
                opened: window.fa4uOpened || 0,
                blocked: window.fa4uOpenBlocked || 0,
                jobs: window.fa4uJobs ? Object.keys(window.fa4uJobs).length : -1,
                flag: window.fa4uSignedIn ? 1 : 0,
                url: String(location.href).slice(0, 120)
            };
            if (window.fa4uOpenError) out.openError = window.fa4uOpenError;
            // The SDK keeps its session in localStorage. A WebView with
            // storage blocked would leave every reload signed out with no
            // error anywhere, which looks exactly like a sign-in that failed.
            try {
                localStorage.setItem('fa4u.probe', '1');
                localStorage.removeItem('fa4u.probe');
                out.storage = 'ok';
            } catch (e) {
                out.storage = 'blocked';
            }
            try {
                out.signedIn = puter.auth.isSignedIn() ? 1 : 0;
            } catch (e) {
                out.signedIn = -1;
            }
            return JSON.stringify(out);
        };
    </script>
    <script src="https://js.puter.com/v2/"
            onload="window.fa4uScript = 'loaded'"
            onerror="window.fa4uScript = 'failed'"></script>
    <style>
        html, body { margin: 0; height: 100%; background: #0f1115; color: #e8eaf0; font: 16px/1.45 system-ui, sans-serif; }
        #fa4u-signin { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
        #fa4u-signin[hidden] { display: none; }
        #fa4u-signin .card { width: 100%; max-width: 360px; }
        #fa4u-signin .title { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
        #fa4u-signin .note { color: #a4a9b6; margin: 0 0 24px; }
        #fa4u-signin button { display: block; width: 100%; min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; margin-top: 12px; }
        #fa4u-go { background: #7c6cff; color: #fff; }
        #fa4u-go:disabled { opacity: 0.6; }
        #fa4u-cancel { background: transparent; color: #a4a9b6; }
    </style>
</head>
<body>
<!--
  Shown only while the app is asking for a Puter sign-in (PuterBridge.kt makes
  this WebView full-screen for exactly that long). Puter opens its sign-in
  window only from a real user gesture; the Continue tap is that gesture.
-->
<div id="fa4u-signin" hidden>
    <div class="card">
        <p class="title">Sign in to Puter</p>
        <p class="note">Puter opens its own sign-in window after a tap. Your Puter account pays for Puter chats and pictures.</p>
        <button id="fa4u-go" type="button" onclick="window.fa4uContinueSignIn()">Continue</button>
        <button id="fa4u-cancel" type="button" onclick="window.fa4uCancelSignIn()">Cancel</button>
    </div>
</div>
<script>
    window.fa4uJobs = {};

    // Mirrors the web app's own signed-in tracking (app.js's
    // onAuthStateChanged), so a sign-in that completes is knowable the same
    // way here as there: a reactive flag, not only the signIn() promise
    // resolving. puter.auth.signIn()'s own promise depends on window.opener
    // reaching back into this page from its popup, a channel Android's
    // separate popup WebView is not guaranteed to keep working; this flag is
    // what PuterBridge.kt's resolveSignInFromCurrentState polls as a
    // fallback once the popup visibly closes.
    window.fa4uSignedIn = false;
    try {
        // Guarded: everything below this (fa4uStatus, fa4uChat, fa4uSignIn,
        // fa4uDraw) is defined later in this same script block, so a throw
        // here -- Puter's SDK is not guaranteed to be done with its own
        // async setup the instant its script tag finishes executing --
        // would silently take all of them down with it, turning every
        // window.fa4uX && window.fa4uX(...) call on the Kotlin side into a
        // permanent no-op with no error ever surfaced.
        if (typeof puter !== 'undefined' && puter.auth && typeof puter.auth.onAuthStateChanged === 'function') {
            puter.auth.onAuthStateChanged(function (user) { window.fa4uSignedIn = !!user; });
        }
    } catch (e) {
        console.error('fa4u: onAuthStateChanged registration failed: ' + (e && e.message || e));
    }

    function toDataUrl(blob) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = function () { reject(new Error('could not read the picture')); };
            reader.readAsDataURL(blob);
        });
    }

    // txt2img answers with an <img> whose src may be a data: URL, a blob: URL
    // or a plain link; each becomes a data URL the app can decode.
    async function imageToDataUrl(result) {
        var src = result && (result.src || (typeof result === 'string' ? result : ''));
        if (!src) throw new Error('Puter returned no picture');
        if (src.indexOf('data:image/') === 0) return src;
        var response = await fetch(src);
        if (!response.ok) throw new Error('could not fetch the picture');
        return toDataUrl(await response.blob());
    }

    // Puter rejects with {message, code, errorCode}; a spent allowance is
    // errorCode insufficient_funds (HTTP 402), which the SDK would otherwise
    // answer with an upgrade dialog nobody can see in a hidden WebView.
    function describe(error) {
        if (!error) return 'Puter failed';
        if (typeof error === 'string') return error;
        var code = error.errorCode || error.code || (error.error && error.error.code) || '';
        if (code === 'insufficient_funds' || code === 'subscription_required') return 'Puter credits used up';
        if (code === 'too_many_requests') return 'Puter rate limit';
        if (code === 'moderation_flagged') return 'Puter refused this prompt';
        return error.message || (error.error && (error.error.message || error.error)) || code || 'Puter failed';
    }

    window.fa4uStatus = function (id) {
        var job = window.fa4uJobs[id];
        if (!job) return JSON.stringify({ state: 'missing' });
        return JSON.stringify({ state: job.state, length: job.length || 0, error: job.error || '' });
    };

    window.fa4uChunk = function (id, offset, size) {
        var job = window.fa4uJobs[id];
        return job && job.data ? job.data.substr(offset, size) : '';
    };

    window.fa4uForget = function (id) {
        delete window.fa4uJobs[id];
    };

    // Chat, for the Android app's Puter provider. Puter answers in the
    // browser on the user's own account, so the server has no route for it and
    // the app reaches it the same way it reaches drawing: a job here, polled
    // from Kotlin. The reply is appended to the job as it streams, so the app
    // can read it in slices while it is still being written -- state stays
    // "pending" until the last chunk, and `length` only ever grows.
    window.fa4uChat = async function (id, payload) {
        var jobs = window.fa4uJobs;
        jobs[id] = { state: 'pending', data: '', length: 0 };
        try {
            if (typeof puter === 'undefined') throw new Error('Puter did not load ' + window.fa4uDiagnose());
            var signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
            if (!signedIn) throw new Error('sign in to Puter in Web app first');
            var request = typeof payload === 'string' ? JSON.parse(payload) : (payload || {});
            var messages = Array.isArray(request.messages) ? request.messages : [];
            var options = { stream: true };
            if (request.model) options.model = String(request.model);
            var response = await puter.ai.chat(messages, options);
            for await (var part of response) {
                if (!jobs[id]) return;
                var text = part && (part.text || (part.message && part.message.content) || '');
                if (typeof text !== 'string') text = '';
                if (text) {
                    jobs[id].data += text;
                    jobs[id].length = jobs[id].data.length;
                }
            }
            if (jobs[id]) jobs[id].state = 'done';
        } catch (error) {
            jobs[id] = { state: 'error', error: String(describe(error)).slice(0, 300), data: (jobs[id] && jobs[id].data) || '', length: (jobs[id] && jobs[id].length) || 0 };
        }
    };

    // A deliberate, user-requested sign-in -- not one fa4uChat/fa4uDraw trigger
    // on their own, so a background picture or reply never pops a login window
    // out of nowhere. puter.auth.signIn() opens the same window.open() popup
    // Android's WebChromeClient now knows how to host; this job just waits for
    // it to resolve (or for the user to close it without finishing).
    // Resolves the moment the account actually becomes signed in, and gives
    // up after [ms] with the diagnosis rather than a bare timeout. Raced
    // against signIn()'s own promise below because that promise resolves
    // through window.opener reaching back from the popup -- if that channel
    // is what is broken, the sign-in can genuinely succeed while the promise
    // it was supposed to be reported by never settles at all.
    function signedInWithin(ms, id) {
        var deadline = Date.now() + ms;
        return new Promise(function (resolve, reject) {
            (function tick() {
                // The race this feeds is already over: stop polling rather
                // than tick on for the rest of [ms] with nobody listening.
                var job = window.fa4uJobs[id];
                if (!job || job.state !== 'pending') return;
                var yes = false;
                try {
                    yes = !!(window.fa4uSignedIn || (puter.auth && puter.auth.isSignedIn()));
                } catch (e) {
                    yes = false;
                }
                if (yes) return resolve();
                if (Date.now() >= deadline) {
                    return reject(new Error('Puter never reported a sign-in ' + window.fa4uDiagnose()));
                }
                setTimeout(tick, 500);
            })();
        });
    }

    // The sign-in job waiting on the Continue tap, if any.
    var pendingSignIn = null;

    function showSignIn(show) {
        var box = document.getElementById('fa4u-signin');
        if (box) box.hidden = !show;
        var go = document.getElementById('fa4u-go');
        if (go) go.disabled = false;
    }

    function finishSignIn(id, result) {
        if (pendingSignIn === id) pendingSignIn = null;
        showSignIn(false);
        window.fa4uJobs[id] = result;
    }

    // Asked for by the app (evaluateJavascript), which is not a user
    // gesture -- and Puter's signIn() opens its window only from one
    // (hasUserActivation() in its Auth module); without it Puter shows a
    // consent prompt inside this page instead, which in the app's invisible
    // WebView nobody could see, so the promise never settled. So this only
    // shows the page's own prompt; the Continue tap below is what calls Puter.
    window.fa4uSignIn = function (id) {
        var jobs = window.fa4uJobs;
        jobs[id] = { state: 'pending' };
        if (typeof puter === 'undefined') {
            jobs[id] = { state: 'error', error: ('Puter did not load ' + window.fa4uDiagnose()).slice(0, 300) };
            return;
        }
        var signedIn = false;
        try {
            signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
        } catch (e) {
            signedIn = false;
        }
        if (signedIn) {
            jobs[id] = { state: 'done', length: 0, data: '' };
            return;
        }
        pendingSignIn = id;
        showSignIn(true);
    };

    // The Continue button's own click handler, so Puter sees the tap as the
    // gesture it requires: signIn() must be called synchronously in here, not
    // after an await. 110s stays inside PuterBridge.kt's own poll budget, so
    // the page gets to say *why* before Kotlin can only say "timed out".
    window.fa4uContinueSignIn = function () {
        var id = pendingSignIn;
        if (!id) return;
        var go = document.getElementById('fa4u-go');
        if (go) go.disabled = true;
        var started;
        try {
            started = puter.auth.signIn();
        } catch (error) {
            started = Promise.reject(error);
        }
        Promise.race([started, signedInWithin(110000, id)]).then(function () {
            finishSignIn(id, { state: 'done', length: 0, data: '' });
        }, function (error) {
            finishSignIn(id, { state: 'error', error: String(describe(error)).slice(0, 300) });
        });
    };

    window.fa4uCancelSignIn = function () {
        var id = pendingSignIn;
        if (!id) return;
        finishSignIn(id, { state: 'error', error: 'Puter sign-in cancelled' });
    };

    window.fa4uDraw = async function (id, prompt, options) {
        var jobs = window.fa4uJobs;
        options = options || {};
        jobs[id] = { state: 'pending' };
        try {
            if (typeof puter === 'undefined') throw new Error('Puter did not load ' + window.fa4uDiagnose());
            var signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
            if (!signedIn) throw new Error('sign in to Puter in Web app first');
            var args = { quality: 'high' };
            if (options.model) args.model = String(options.model);
            if (options.ratio && options.ratio.w && options.ratio.h) args.ratio = { w: options.ratio.w, h: options.ratio.h };
            if (options.source) args.input_images = [String(options.source)];
            var image = await puter.ai.txt2img(String(prompt || '').slice(0, 2000), args);
            var dataUrl = await imageToDataUrl(image);
            // The app reads the picture back in slices (fa4uChunk), so no
            // single evaluateJavascript result has to carry megabytes.
            jobs[id] = { state: 'done', length: dataUrl.length, data: dataUrl };
        } catch (error) {
            jobs[id] = { state: 'error', error: String(describe(error)).slice(0, 300) };
        }
    };
</script>
</body>
</html>
