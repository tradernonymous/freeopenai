<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NeuraOS Puter bridge</title>
    <!--
      Loaded invisibly by the Android app (PuterBridge.kt) so it can draw and
      chat on the user's own Puter account. fa4uSignIn(id) is the one job that
      opens a window of its own -- puter.auth.signIn()'s popup, which Android's
      WebChromeClient hosts in a visible dialog -- and it only runs when the
      app asks for it directly, never as a side effect of a background job.
      fa4uDraw(id, prompt, options) and fa4uChat(id, payload) fail fast instead
      if nobody has signed in yet. Every job is read the same way: poll
      fa4uStatus(id), then fa4uChunk for the picture. options is optional:
      { model, ratio: {w,h}, source }.
    -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
    window.fa4uJobs = {};

    function toDataUrl(blob) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = function () { reject(new Error('could not read the picture')); };
            reader.readAsDataURL(blob);
        });
    }

    // txt2img answers with an <img> whose src may be a data: URL, a blob: URL
    // or a plain link; each becomes a data URL the app can decode.
    async function imageToDataUrl(result) {
        var src = result && (result.src || (typeof result === 'string' ? result : ''));
        if (!src) throw new Error('Puter returned no picture');
        if (src.indexOf('data:image/') === 0) return src;
        var response = await fetch(src);
        if (!response.ok) throw new Error('could not fetch the picture');
        return toDataUrl(await response.blob());
    }

    // Puter rejects with {message, code, errorCode}; a spent allowance is
    // errorCode insufficient_funds (HTTP 402), which the SDK would otherwise
    // answer with an upgrade dialog nobody can see in a hidden WebView.
    function describe(error) {
        if (!error) return 'Puter failed';
        if (typeof error === 'string') return error;
        var code = error.errorCode || error.code || (error.error && error.error.code) || '';
        if (code === 'insufficient_funds' || code === 'subscription_required') return 'Puter credits used up';
        if (code === 'too_many_requests') return 'Puter rate limit';
        if (code === 'moderation_flagged') return 'Puter refused this prompt';
        return error.message || (error.error && (error.error.message || error.error)) || code || 'Puter failed';
    }

    window.fa4uStatus = function (id) {
        var job = window.fa4uJobs[id];
        if (!job) return JSON.stringify({ state: 'missing' });
        return JSON.stringify({ state: job.state, length: job.length || 0, error: job.error || '' });
    };

    window.fa4uChunk = function (id, offset, size) {
        var job = window.fa4uJobs[id];
        return job && job.data ? job.data.substr(offset, size) : '';
    };

    window.fa4uForget = function (id) {
        delete window.fa4uJobs[id];
    };

    // Chat, for the Android app's Puter provider. Puter answers in the
    // browser on the user's own account, so the server has no route for it and
    // the app reaches it the same way it reaches drawing: a job here, polled
    // from Kotlin. The reply is appended to the job as it streams, so the app
    // can read it in slices while it is still being written -- state stays
    // "pending" until the last chunk, and `length` only ever grows.
    window.fa4uChat = async function (id, payload) {
        var jobs = window.fa4uJobs;
        jobs[id] = { state: 'pending', data: '', length: 0 };
        try {
            if (typeof puter === 'undefined') throw new Error('Puter did not load');
            var signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
            if (!signedIn) throw new Error('sign in to Puter in Web app first');
            var request = typeof payload === 'string' ? JSON.parse(payload) : (payload || {});
            var messages = Array.isArray(request.messages) ? request.messages : [];
            var options = { stream: true };
            if (request.model) options.model = String(request.model);
            var response = await puter.ai.chat(messages, options);
            for await (var part of response) {
                if (!jobs[id]) return;
                var text = part && (part.text || (part.message && part.message.content) || '');
                if (typeof text !== 'string') text = '';
                if (text) {
                    jobs[id].data += text;
                    jobs[id].length = jobs[id].data.length;
                }
            }
            if (jobs[id]) jobs[id].state = 'done';
        } catch (error) {
            jobs[id] = { state: 'error', error: String(describe(error)).slice(0, 300), data: (jobs[id] && jobs[id].data) || '', length: (jobs[id] && jobs[id].length) || 0 };
        }
    };

    // A deliberate, user-requested sign-in -- not one fa4uChat/fa4uDraw trigger
    // on their own, so a background picture or reply never pops a login window
    // out of nowhere. puter.auth.signIn() opens the same window.open() popup
    // Android's WebChromeClient now knows how to host; this job just waits for
    // it to resolve (or for the user to close it without finishing).
    window.fa4uSignIn = async function (id) {
        var jobs = window.fa4uJobs;
        jobs[id] = { state: 'pending' };
        try {
            if (typeof puter === 'undefined') throw new Error('Puter did not load');
            var signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
            if (!signedIn) await puter.auth.signIn();
            jobs[id] = { state: 'done', length: 0, data: '' };
        } catch (error) {
            jobs[id] = { state: 'error', error: String(describe(error)).slice(0, 300) };
        }
    };

    window.fa4uDraw = async function (id, prompt, options) {
        var jobs = window.fa4uJobs;
        options = options || {};
        jobs[id] = { state: 'pending' };
        try {
            if (typeof puter === 'undefined') throw new Error('Puter did not load');
            var signedIn = puter.auth && typeof puter.auth.isSignedIn === 'function' ? puter.auth.isSignedIn() : false;
            if (!signedIn) throw new Error('sign in to Puter in Web app first');
            var args = { quality: 'high' };
            if (options.model) args.model = String(options.model);
            if (options.ratio && options.ratio.w && options.ratio.h) args.ratio = { w: options.ratio.w, h: options.ratio.h };
            if (options.source) args.input_images = [String(options.source)];
            var image = await puter.ai.txt2img(String(prompt || '').slice(0, 2000), args);
            var dataUrl = await imageToDataUrl(image);
            // The app reads the picture back in slices (fa4uChunk), so no
            // single evaluateJavascript result has to carry megabytes.
            jobs[id] = { state: 'done', length: dataUrl.length, data: dataUrl };
        } catch (error) {
            jobs[id] = { state: 'error', error: String(describe(error)).slice(0, 300) };
        }
    };
</script>
</body>
</html>
