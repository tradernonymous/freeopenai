[package]
name = "freeai4u-desktop"
version = "2.10.0"
description = "NeuraOS Desktop — chat, images, local models and approval-gated builds on the FreeAI4U engine"
authors = ["printezy247"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
# Phase 5: the Quick window hotkey and system notifications.
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
winreg = "0.52"
base64 = "0.22"
rfd = "0.15"
# The network edge: rustls so the Windows build needs no OpenSSL, and no
# default features we do not use.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
# The OS credential store (Credential Manager / Keychain / kernel keyring)
# for the Hugging Face token, so it never sits in localStorage as plain text.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
